services:
  # 1. Main Application Container (Nginx + PHP 8.4-FPM + Queue Worker)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: apexcare_app
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL:-http://localhost}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-hospital_db}"
      DB_USERNAME: "${DB_USERNAME:-hospital_user}"
      DB_PASSWORD: "${DB_PASSWORD:-hospital_secret}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
    volumes:
      - storage_data:/var/www/html/storage/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - apexcare_network

  # 2. Production PostgreSQL 18 Relational Database
  postgres:
    image: postgres:18-alpine
    container_name: apexcare_postgres
    restart: always
    environment:
      POSTGRES_DB: "${DB_DATABASE:-hospital_db}"
      POSTGRES_USER: "${DB_USERNAME:-hospital_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-hospital_secret}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-hospital_user} -d ${DB_DATABASE:-hospital_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apexcare_network

  # 3. High-Performance Redis 7 In-Memory Cache & Queue Broker
  redis:
    image: redis:7-alpine
    container_name: apexcare_redis
    restart: always
    volumes:
      - redisdata:/data
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apexcare_network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  storage_data:
    driver: local

networks:
  apexcare_network:
    driver: bridge
